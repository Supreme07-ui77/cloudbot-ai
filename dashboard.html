<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBot AI Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.header{
background:#1e293b;
padding:15px;
display:flex;
justify-content:space-between;
}

.chat-box{
padding:20px;
height:400px;
overflow:auto;
}

.input-box{
position:fixed;
bottom:0;
width:100%;
display:flex;
}

input{
flex:1;
padding:15px;
border:none;
}

button{
padding:15px;
border:none;
background:#2563eb;
color:white;
cursor:pointer;
}
</style>

</head>
<body>

<div class="header">

<span id="user"></span>

<button onclick="logout()">Logout</button>

</div>

<div class="chat-box" id="chat">

<p>Welcome to CloudBot AI 🚀</p>

</div>

<div class="input-box">

<input id="prompt" placeholder="Ask anything...">

<button onclick="send()">Send</button>

</div>

<script>

let user = localStorage.getItem("cloudbot_user");

if(!user){
window.location.href="index.html";
}

document.getElementById("user").innerText=user;

function logout(){
localStorage.removeItem("cloudbot_user");
window.location.href="index.html";
}

function send(){

let prompt = document.getElementById("prompt").value;

if(prompt=="") return;

let chat = document.getElementById("chat");

chat.innerHTML += "<p><b>You:</b> "+prompt+"</p>";

chat.innerHTML += "<p><b>AI:</b> This is demo response for: "+prompt+"</p>";

document.getElementById("prompt").value="";

}

</script>

</body>
</html>
