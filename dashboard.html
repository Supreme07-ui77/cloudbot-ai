<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBot AI Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#1e3c72;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
color:black;
padding:30px;
border-radius:12px;
text-align:center;
width:350px;
}

button{
padding:12px;
margin-top:15px;
border:none;
background:#1e3c72;
color:white;
cursor:pointer;
width:100%;
}
</style>

</head>
<body>

<div class="container">

<h2>CloudBot AI Dashboard</h2>

<p id="welcome"></p>

<button onclick="logout()">Logout</button>

</div>

<script>

// check login
let user = localStorage.getItem("cloudbot_user");

// if not logged in
if(user === null){
window.location.href = "index.html";
}

// show user
document.getElementById("welcome").innerText =
"Welcome: " + user;

// logout function
function logout(){

localStorage.removeItem("cloudbot_user");

window.location.href = "index.html";

}

</script>

</body>
</html>
