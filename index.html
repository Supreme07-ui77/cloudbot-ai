<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBot AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.chat-container{
width:100%;
max-width:500px;
height:600px;
background:white;
border-radius:15px;
display:flex;
flex-direction:column;
box-shadow:0 0 20px rgba(0,0,0,0.3);
overflow:hidden;
}

.header{
background:#2a5298;
color:white;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.chat-box{
flex:1;
padding:15px;
overflow-y:auto;
background:#f4f6fb;
}

.message{
margin:10px 0;
padding:10px;
border-radius:10px;
max-width:80%;
}

.user{
background:#2a5298;
color:white;
margin-left:auto;
}

.bot{
background:#e5e7eb;
color:black;
}

.input-area{
display:flex;
border-top:1px solid #ccc;
}

input{
flex:1;
padding:15px;
border:none;
outline:none;
font-size:16px;
}

button{
padding:15px;
border:none;
background:#2a5298;
color:white;
cursor:pointer;
}

button:hover{
background:#1e3c72;
}
</style>

</head>
<body>

<div class="chat-container">

<div class="header">
CloudBot AI ☁️
</div>

<div class="chat-box" id="chatBox">
<div class="message bot">Hello! Ask anything.</div>
</div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Ask anything...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

const API_KEY = "AIzaSyA1__wXgNCVPHgPBspoygL3YDeZAj3e6Oc";

async function sendMessage(){

const input = document.getElementById("userInput");
const text = input.value.trim();

if(!text) return;

addMessage(text,"user");
input.value="";

const loading = addMessage("Typing...","bot");

try{

const res = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[{
parts:[{text:text}]
}]
})
}
);

const data = await res.json();

loading.remove();

if(data.candidates){

addMessage(
data.candidates[0].content.parts[0].text,
"bot"
);

}else{

addMessage("No response","bot");

}

}catch{

loading.remove();
addMessage("Error","bot");

}

}

function addMessage(text,type){

const chatBox = document.getElementById("chatBox");

const msg = document.createElement("div");

msg.className = "message "+type;
msg.innerText = text;

chatBox.appendChild(msg);

chatBox.scrollTop = chatBox.scrollHeight;

return msg;

}

</script>

</body>
</html>
