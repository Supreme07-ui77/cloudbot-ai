<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBot AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
color:black;
padding:30px;
border-radius:12px;
width:350px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:#2a5298;
color:white;
border:none;
cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h1>CloudBot AI</h1>

<input id="email" placeholder="Email">
<input id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

let email = document.getElementById("email").value;

if(email==""){
alert("Enter email");
return;
}

localStorage.setItem("cloudbot_user", email);

window.location.href="dashboard.html";

}

</script>

</body>
</html>
